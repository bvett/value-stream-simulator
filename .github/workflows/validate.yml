name: Validate

on: workflow_call

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/value_stream/app/frontend/package-lock.json
      - run: uv sync --locked --all-extras --dev
      - run: npm ci --prefix src/value_stream/app/frontend
      - name: Check generated contracts and types
        run: |
          uv run python -m value_stream.app.contracts
          npm run generate:api --prefix src/value_stream/app/frontend
          git diff --exit-code -- src/value_stream/app/openapi.json src/value_stream/service/openapi.json src/value_stream/app/frontend/src/api.generated.ts
          npm run build --prefix src/value_stream/app/frontend
      - name: Check persistence types, frozen bundle, and import/help startup behavior
        run: |
          uv run pyright --project .agent/pyright-persistence.json
          uv run python scripts/verify_distributions.py
          uv run pytest -o addopts='' tests/integration/test_startup_recovery.py::TestStartup::test_factories_imports_contracts_and_help_do_not_start_resources -q
      - name: Verify wheel assets
        run: |
          uv build --sdist --wheel --out-dir dist/app
          uv run python scripts/verify_distributions.py --wheel "$(find dist/app -name '*.whl' -print -quit)" --sdist "$(find dist/app -name '*.tar.gz' -print -quit)"
          uv run python scripts/verify_installed.py "$(find dist/app -name '*.whl' -print -quit)"
      - name: Verify real container recreation with persistent volumes
        run: |
          docker build -t value-stream-service:ci -f Dockerfile .
          docker build -t value-stream-application:ci -f Dockerfile.app .
          uv run python scripts/verify_containers.py --application-image value-stream-application:ci --service-image value-stream-service:ci
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-artifacts
          path: |
            dist/app/*
