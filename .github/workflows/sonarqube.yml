name: Code Scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Retrieve coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-artifacts-3.11

      - name: Set Sonar Project Version
        run: |
          PACKAGE_VERSION=$(python -c "import src.value_stream.__version__ as v; print(v.__version__)")
          echo $'\n' >> sonar-project.properties
          echo "sonar.projectVersion=${PACKAGE_VERSION##*/}" >> sonar-project.properties
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
