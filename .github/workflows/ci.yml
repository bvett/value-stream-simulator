name: CI

on:
  push:
    branches: [feature/*]
    tags-ignore:
      - "*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  validate:
    uses: ./.github/workflows/validate.yml
    needs:
      - test
