name: CI

on:
  push:
    branches: [ main, develop, feature/web-app ]
  tags: 
    - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true

    
    - name: Install project
      run: |
        uv sync --locked --all-extras --dev
    
    - name: Lint with pylint
      run: |
        uv run pylint src/value_stream --disable=missing-module-docstring --disable=missing-class-docstring --disable=missing-function-docstring
      continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true


    - name: Install project
      run: |
        uv sync --locked --all-extras --dev

    - name: Run tests with pytest
      run: |
        uv run pytest --cov=src/value_stream --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  browser-app:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: src/value_stream/app/frontend/package-lock.json
    - run: uv sync --locked --all-extras --dev
    - run: npm ci --prefix src/value_stream/app/frontend
    - name: Check generated contracts and types
      run: |
        uv run python -m value_stream.app.contracts
        npm run generate:api --prefix src/value_stream/app/frontend
        git diff --exit-code -- src/value_stream/app/openapi.json src/value_stream/service/openapi.json src/value_stream/app/frontend/src/api.generated.ts
    - run: npm run typecheck --prefix src/value_stream/app/frontend
    - run: npm test --prefix src/value_stream/app/frontend -- --run
    - run: npm run build --prefix src/value_stream/app/frontend
    - name: Install browser and run production UI tests
      working-directory: src/value_stream/app/frontend
      run: |
        npx playwright install --with-deps chromium
        npm run test:e2e
    - name: Verify wheel assets
      run: |
        uv build --sdist --wheel --out-dir dist/app
        uv run python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/app/*.whl')[0]).namelist(); assert 'value_stream/app/static/index.html' in names; assert any('/static/assets/' in n for n in names); assert not any('/frontend/' in n for n in names)"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: python-artifacts
        path: |
          dist/app/*
  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: startsWith(github.ref, 'ref/tags/')
    needs: 
      - test
      - browser-app
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/value-stream
    permissions:
      id-token: write
    
    steps:
    - name: Download distribution
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/app
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1


