name: Check Version

on: workflow_call

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
    - run: uv sync --locked --all-extras --dev
    - name: Validate package version consistency
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        PACKAGE_VERSION=$(python -c "import src.value_stream.__version__ as v; print(v.__version__)")

        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
        echo "Version mismatch! GitHub tag is $TAG_VERSION but package version is $PACKAGE_VERSION."
        exit 1
        fi
