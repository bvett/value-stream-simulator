[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_stream"]

[project]
name = "value_stream"
version = "0.1.0"
requires-python = ">=3.11"
authors = [
    {name="Brian Vetter", email="bvetter@gmail.com"},
]
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "simpy>=4.1.0",
    "tqdm>=4.66.0",
    "pydantic>=2",
    "fastapi>=0.99",
    "uvicorn",
    "httpx",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "httpx2>=2.13.0",
]

description = "Conduct software delivery simulations to identify inefficiencies that cause delay and lost value."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[dependency-groups]
dev = [
    "jsondiff>=2.2.1",
]

[tool.coverage.report]
exclude_also = [
    '@(abc\.)?abstractmethod',
]
