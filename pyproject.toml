[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["src/value_stream/app/static/**", "src/value_stream/app/frontend/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/value_stream"]
artifacts = ["src/value_stream/app/static/**"]
exclude = ["src/value_stream/app/frontend/**"]

[project]
name = "value-stream"
version = "0.1.6"
requires-python = ">=3.11"
authors = [
    {name="Brian Vetter", email="bvetter@gmail.com"},
]

dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "simpy>=4.1.0",
    "tqdm>=4.66.0",
    "pydantic>=2",
    "fastapi>=0.99",
    "uvicorn",
    "httpx",
    "httpx2>=2.13.0"
]

description = "Stop value leaks in your software delivery pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]


[project.urls]
Repository = "https://github.com/bvett/value-stream-simulator.git"
Issues = "https://github.com/bvett/value-stream-simulator/issues"


[dependency-groups]
dev = [
    "jsondiff>=2.2.1",
    "pylint>=4.0.8",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "black>=26.10.0",
    "twine>=7.0.0",
]

[tool.pytest]
addopts = ["--cov=src", "--cov-report=xml", "--cov-report=term-missing", "-s"]
testpaths= ["tests"]


[tool.black]
line-length=100
target-version=['py311', 'py312', 'py313', 'py314']
